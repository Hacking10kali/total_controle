name: Test Anime Scraping

on:
  workflow_dispatch:
    inputs:
      anime_name:
        description: 'Nom de l\'anime à tester'
        required: true
        type: string
      dry_run:
        description: 'Mode dry-run (sans écriture Firebase)'
        required: false
        type: boolean
        default: true

jobs:
  test-scraping:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp playwright firebase-admin
        
    - name: Install Playwright browsers
      run: |
        playwright install chromium
        
    - name: Run test scraping
      env:
        FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        ANIME_NAME: ${{ github.event.inputs.anime_name }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
      run: |
        python test_anime_search.py
